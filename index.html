<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<meta name="description" content="My God Box — a quiet place to turn over what you cannot control.">
<title>My God Box</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b0b0b'/%3E%3Ctext x='50' y='65' text-anchor='middle' font-size='58' fill='%23e3b86b'%3E✦%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="Open menu">☰</button>
    <div class="brand">My God Box</div>
    <button class="icon-btn" id="lockBtn" aria-label="Lock app">◉</button>
  </header>

  <main id="main" class="screen"></main>

  <nav class="bottom-nav" aria-label="Main navigation">
    <button data-view="home" class="nav-item active"><span>⌂</span><small>Home</small></button>
    <button data-view="entries" class="nav-item"><span>▤</span><small>Entries</small></button>
    <button data-view="reflect" class="nav-item"><span>♡</span><small>Reflect</small></button>
    <button data-view="quiet" class="nav-item"><span>♧</span><small>Quiet</small></button>
  </nav>
</div>

<div id="drawer" class="drawer-backdrop hidden">
  <aside class="drawer">
    <div class="drawer-head"><h2>My God Box</h2><button class="icon-btn" id="closeDrawer">×</button></div>
    <button class="drawer-link" data-drawer="home">⌂ <span>Home</span></button>
    <button class="drawer-link" data-drawer="entries">▤ <span>My Entries</span></button>
    <button class="drawer-link" data-drawer="reflections">♡ <span>My Reflections</span></button>
    <button class="drawer-link" data-drawer="reflect">✎ <span>Write a Reflection</span></button>
    <button class="drawer-link" data-drawer="quiet">♧ <span>Quiet Space</span></button>
    <hr>
    <button class="drawer-link" data-drawer="themes">✦ <span>Themes</span></button>
    <button class="drawer-link" data-drawer="settings">⚙ <span>Settings</span></button>
    <button class="drawer-link" data-drawer="about">ⓘ <span>About</span></button>
  </aside>
</div>

<div id="modal" class="modal-backdrop hidden"><div class="modal" id="modalContent"></div></div>
<script src="app.js"></script>
</body>
</html>
